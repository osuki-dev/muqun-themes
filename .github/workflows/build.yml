name: Build

# After a merge to main: pack the sources that changed, regenerate index.json,
# verify the result, publish both to the `release` branch and mirror what
# differs into R2. The release branch is rebuilt whole and force-pushed every
# time, so it is always exactly what main produces and binaries never
# accumulate in history. muqun.dev/api/themes/ serves the R2 mirror; that is
# what the website, `muqun-theme list` and the app read.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Present on this repository, absent on a fork: the R2 step keys off it.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Restore the previous build
        # dist/ and index.json are gitignored on main; the last build lives on
        # the release branch. With it in place, `build` repacks only sources
        # whose digest changed, everything else keeps its bytes and sha256, and
        # the R2 step below uploads only what differs.
        run: |
          if git fetch --quiet origin release 2>/dev/null; then
            git checkout --quiet origin/release -- dist index.json
            cp index.json previous-index.json
            echo "restored $(jq '.themes | length' index.json) theme(s) from release"
          else
            echo '{"format":"muqun-themes-index","themes":[]}' > previous-index.json
            echo "no release branch yet: building everything"
          fi

      - name: Pack changed sources and regenerate the catalogue
        run: bunx @osuki-dev/muqun-theme@2 build

      - name: Verify the result the way a full check would
        run: bunx @osuki-dev/muqun-theme@2 check

      - name: Mirror what changed to R2
        # Keys match the release branch exactly, so the `package` and
        # `preview` fields in index.json are the object keys. The old and new
        # index are diffed by sha256: changed and new packages go up first,
        # then the previews, then the index, and only then are packages and
        # previews whose source is gone removed -- so the index in the bucket
        # never names a file that is not there.
        if: env.R2_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the newer S3 checksum headers the AWS CLI
          # sends by default; these make it send them only when asked.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: s3://muqun-themes
        run: |
          jq -r --slurpfile old previous-index.json '
            .themes[] as $t
            | select(([$old[0].themes[] | select(.id == $t.id and .sha256 == $t.sha256)] | length) == 0)
            | $t.package' index.json > changed.txt
          jq -r --slurpfile new index.json '
            .themes[] as $t
            | select(([$new[0].themes[] | select(.id == $t.id)] | length) == 0)
            | $t.package' previous-index.json > removed.txt
          echo "changed:"; cat changed.txt; echo "removed:"; cat removed.txt

          while read -r key; do
            [ -n "$key" ] || continue
            aws s3 cp "$key" "$BUCKET/$key" --endpoint-url "$ENDPOINT" \
              --content-type application/zip --cache-control "public, max-age=3600"
          done < changed.txt

          # Preview images: `build` writes dist/previews/<id>.<ext> for every
          # theme whose manifest declares a `preview`, and index.json names
          # each as its `preview` field, so the same key convention holds.
          # They are small and few, so the directory is synced whole rather
          # than diffed -- one call per extension, because a content type is
          # set per call and R2 serves whatever type an object was stored
          # with. New and changed images go up before the index, like the
          # packages; removals wait until after it, below.
          mkdir -p dist/previews
          for ext in webp png jpg; do
            case "$ext" in
              webp) type=image/webp ;;
              png) type=image/png ;;
              jpg) type=image/jpeg ;;
            esac
            aws s3 sync dist/previews "$BUCKET/dist/previews" --endpoint-url "$ENDPOINT" \
              --exclude "*" --include "*.$ext" \
              --content-type "$type" --cache-control "public, max-age=3600"
          done

          aws s3 cp index.json "$BUCKET/index.json" --endpoint-url "$ENDPOINT" \
            --content-type "application/json; charset=utf-8" --cache-control "public, max-age=60"

          while read -r key; do
            [ -n "$key" ] || continue
            aws s3 rm "$BUCKET/$key" --endpoint-url "$ENDPOINT"
          done < removed.txt

          # Previews the index no longer names. Everything local is already in
          # the bucket and newer there, so this pass only deletes.
          aws s3 sync dist/previews "$BUCKET/dist/previews" --endpoint-url "$ENDPOINT" \
            --delete --exclude ".gitkeep" --cache-control "public, max-age=3600"

          echo "uploaded $(grep -c . changed.txt || true) package(s), removed $(grep -c . removed.txt || true), synced $(ls dist/previews | grep -c . || true) preview(s), index refreshed"
          rm -f changed.txt removed.txt previous-index.json

      - name: Publish dist/ and index.json to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan commit holding only the build output. `-f` because both
          # paths are gitignored on main on purpose.
          git checkout --orphan release
          git rm -rfq --cached .
          git add -f dist index.json
          git commit -qm "build: from ${GITHUB_SHA}"
          git push --force origin release
          echo "published $(git rev-parse --short HEAD) to release"
